    <!-- before the pre-paint script, which retints it in light mode -->
    <meta name="theme-color" content="#060708" />

    <!-- Applies the saved colour mode, its accent colour and the language
         before first paint, so there is no flash of the defaults. Keys and ids
         must match src/lib/mode.ts, src/lib/accent.ts (accent.test.ts checks)
         and src/i18n/lang.ts. Storage may throw (privacy modes, blocked site
         data), hence the try/catch. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var light = localStorage.getItem('arben:mode') === 'light';
          var ids = light
            ? ['ocean', 'indigo', 'teal', 'crimson', 'burnt-orange']
            : ['cyan', 'violet', 'emerald', 'amber', 'rose'];
          var accent = localStorage.getItem(light ? 'arben:accent-light' : 'arben:accent');
          root.dataset.mode = light ? 'light' : 'dark';
          root.style.colorScheme = light ? 'light' : 'dark';
          root.dataset.accent = ids.indexOf(accent) !== -1 ? accent : ids[0];
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F7F8FA');
          var lang = localStorage.getItem('arben:lang');
          if (lang === 'en' || lang === 'es') root.lang = lang;
        } catch (e) {}
      })();
    </script>

    <!-- The build prerenders the page into #root for crawlers (scripts/prerender.mjs)
         and marks it data-prerendered. It stays hidden until the client app has
         replaced it (App.tsx removes the attribute on mount), so visitors never
         see a flash of static markup. Without JS it is shown as-is, with the
         entrance-animation start states (inline opacity: 0) neutralised. -->
    <style>
      #root[data-prerendered] { visibility: hidden; }
    </style>
    <noscript>
      <style>
        #root[data-prerendered] { visibility: visible; }
        #root[data-prerendered] [style*="opacity"] { opacity: 1 !important; }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Netlify Forms detection: Netlify registers forms by parsing the deployed
         HTML at build time and never sees the React-rendered one, so this hidden
         copy must list every field the real form in Contact.tsx submits. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="correo" />
      <input type="tel" name="whatsapp" />
      <textarea name="proyecto"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
